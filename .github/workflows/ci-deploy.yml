name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter analyze & test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge functions type-check & test
        working-directory: supabase/functions
        run: |
          deno check sync-orders/index.ts sync-tracking/index.ts sync-payments/index.ts integrations/index.ts
          deno test --allow-env --allow-net=jsr.io _shared/

  deploy:
    name: Build & deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build web (production)
        working-directory: app
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Set repository variable SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Set repository variable SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          flutter pub get
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=APP_ENV=production \
            --dart-define=APP_VERSION="${GITHUB_SHA::7}"
          touch build/web/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web
      - id: deployment
        uses: actions/deploy-pages@v4
